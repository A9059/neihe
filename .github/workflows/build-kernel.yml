name: Build 6.1 GKI Kernel (aarch64)

on:
  workflow_dispatch:
    inputs:
      disable_module_sig:
        description: 'Disable CONFIG_MODULE_SIG_FORCE (cheat vendor style)'
        type: boolean
        default: true   # 默认就开，直接出过签名版
  push:
    branches: [ main ]

jobs:
  build:
    name: Build GKI aarch64 (make + clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl flex bison bc build-essential libssl-dev \
            libncurses-dev libelf-dev cpio lz4 xz-utils zstd \
            device-tree-compiler lzop python3 python3-pip \
            ninja-build ccache clang-17 lld-17 llvm-17

      - name: Set up GKI kernel source
        run: |
          mkdir -p workspace
          cd workspace
          git clone --depth 1 --branch android14-6.1 \
            https://android.googlesource.com/kernel/common

      - name: Disable module signature (THE CORE TRICK)
        if: ${{ inputs.disable_module_sig }}
        run: |
          cd workspace/common
          echo 'CONFIG_MODULE_SIG=n' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_MODULE_SIG_FORCE=n' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_LOCALVERSION="-demo-cheat-build"' >> arch/arm64/configs/gki_defconfig
          tail -5 arch/arm64/configs/gki_defconfig

      - name: Build kernel with clang (LLVM=1)
        run: |
          cd workspace/common
          export PATH="/usr/lib/llvm-17/bin:$PATH"
          export LLVM=1 LLVM_IAS=1
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          make gki_defconfig
          make -j$(nproc)

      - name: Package artifacts
        run: |
          cd workspace/common
          mkdir -p ../dist
          cp arch/arm64/boot/Image ../dist/
          cp arch/arm64/boot/Image.gz ../dist/ 2>/dev/null || gzip -c arch/arm64/boot/Image > ../dist/Image.gz
          lz4 -c arch/arm64/boot/Image > ../dist/Image.lz4
          cp vmlinux ../dist/ 2>/dev/null || true
          cp System.map ../dist/ 2>/dev/null || true
          ls -la ../dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1-kernel-cheat
          path: workspace/dist/*
