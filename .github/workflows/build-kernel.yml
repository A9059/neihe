name: Build 6.1 GKI Kernel (aarch64)

on:
  workflow_dispatch:
    inputs:
      disable_module_sig:
        description: 'Disable CONFIG_MODULE_SIG / FORCE (demo cheat vendor style)'
        type: boolean
        default: false
  push:
    branches: [ main ]

jobs:
  build:
    name: Build GKI aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: /home/runner/.ccache
      # Bazel 需要的 Java
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout this repo (for workflow file)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl flex bison bc \
            build-essential libssl-dev libncurses-dev libelf-dev \
            cpio lz4 xz-utils zstd device-tree-compiler lzop \
            python3 python3-pip ninja-build ccache \
            openjdk-17-jdk-headless unzip zip

      - name: Set up GKI kernel sources (official layout)
        run: |
          mkdir -p workspace
          cd workspace
          # Android 14 GKI kernel source (6.1 LTS)
          git clone --depth 1 --branch android14-6.1 \
            https://android.googlesource.com/kernel/common
          # Build system (kleaf/Bazel) - use main branch
          git clone --depth 1 \
            https://android.googlesource.com/kernel/build
          echo "=== workspace contents ==="
          ls -la
          echo "=== common/ has build.config.gki.aarch64? ==="
          ls -la common/build.config.gki.aarch64

      - name: Optionally disable module signature (demo how cheat vendor does it)
        if: ${{ inputs.disable_module_sig }}
        run: |
          cd workspace
          echo 'CONFIG_MODULE_SIG=n'           >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_MODULE_SIG_FORCE=n'     >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_LOCALVERSION="-demo-build"' >> common/arch/arm64/configs/gki_defconfig
          echo "=== Modified gki_defconfig tail ==="
          tail -5 common/arch/arm64/configs/gki_defconfig

      - name: Bootstrap kleaf prebuilts (download Bazel, Python, toolchains)
        run: |
          cd workspace
          # The kleaf/bazel.sh script bootstraps prebuilts on first run.
          # Run a dummy command to trigger bootstrap (fetch a simple target).
          ./build/kleaf/bazel.sh fetch //common:kernel_aarch64_dist 2>&1 | tail -30

      - name: Build GKI kernel using Google's kleaf (Bazel)
        run: |
          cd workspace
          # Actual build
          ./build/kleaf/bazel.sh build \
            --config=common/build.config.gki.aarch64 \
            //common:kernel_aarch64_dist

      - name: Verify build output & extract version info
        run: |
          cd workspace
          echo "=== dist directories ==="
          find bazel-out -type d -name dist 2>/dev/null || true
          find out -type d -name dist 2>/dev/null || true
          echo "=== key artifacts ==="
          find bazel-out out -type f \( -name "Image*" -o -name "vmlinux" -o -name "System.map" -o -name "Module.symvers" \) 2>/dev/null | head -20
          # Extract kernel version string
          VMLINUX=$(find bazel-out out -name "vmlinux" -type f 2>/dev/null | head -1)
          if [ -n "$VMLINUX" ]; then
            echo "=== Kernel version from vmlinux ==="
            strings "$VMLINUX" | grep -E 'Linux version' | head -1
          else
            IMAGE=$(find bazel-out out -name "Image" -type f 2>/dev/null | head -1)
            if [ -n "$IMAGE" ]; then
              echo "=== Fallback: check Image ==="
              strings "$IMAGE" | grep -E 'Linux version' | head -1
            fi
          fi
          echo "=== vermagic (if module build) ==="
          find bazel-out out -name "vermagic*" -exec cat {} \; 2>/dev/null || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1-kernel${{ inputs.disable_module_sig && '-no-sig' || '' }}
          path: |
            workspace/bazel-out/**/dist/*
            workspace/out/**/dist/*
            workspace/bazel-out/**/vmlinux
            workspace/out/**/vmlinux
          if-no-files-found: error
